{% extends "base.html" %}

{% block title %}Check Your Email | Shopora{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            we'll send instructions to reset your password.
        </p>

        <a href="{% url 'login' %}" class="auth-button">
            Back to Login
        </a>
    </div>
</section>
{% endblock %}
