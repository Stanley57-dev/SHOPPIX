
{% extends "base.html" %}

{% block title %}Change Password | Shopora{% endblock %}

{% block content %}

<section class="account-page">
    <div class="container">
        <div class="account-card" style="max-width: 550px; margin: 30px auto;">
            <h1>Change Password</h1>
            <p>Update your password to keep your Shopora account secure.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="account-logout-button"
                    style="background: var(--orange); color: white; border: none;">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
