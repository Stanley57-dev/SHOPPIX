
{% extends "base.html" %}

{% block title %}Password Updated | Shopora{% endblock %}

{% block content %}

<section class="account-page">
    <div class="container">
        <div class="account-card" style="max-width: 550px; margin: 30px auto; text-align: center;">
            <div style="font-size: 45px;">✓</div>

            <h1>Password Updated!</h1>

            <p>Your Shopora account password has been changed successfully.</p>

            <a href="{% url 'account_profile' %}" class="account-logout-button"
               style="display: inline-block; width: auto; margin-top: 20px; text-decoration: none;">
                Return to My Account
            </a>
        </div>
    </div>
</section>

{% endblock %}
