
{% extends "base.html" %}

{% block title %}Login | Shopora{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Welcome Back!</h1>
        <p>Sign in to your Shopora account.</p>

        <form method="POST">
            {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}

            <button type="submit">Sign In</button>
        </form>

       <p class="auth-link">
    <a href="{% url 'password_reset' %}">Forgot Password?</a>
</p>

<p class="auth-link">
    Don't have an account?
    <a href="{% url 'register' %}">Create Account</a>
</p>
    </div>
</section>
{% endblock %}
