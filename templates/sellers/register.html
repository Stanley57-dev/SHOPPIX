
{% extends "base.html" %}

{% block title %}Become a Seller | Shopora{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <h1>Open Your Shopora Store</h1>

        <p>
            Join Shopora as a seller and start reaching more customers.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Submit Application</button>
        </form>

        <p class="auth-link">
            Your application will be reviewed by our admin team.
        </p>
    </div>
</section>

{% endblock %}
